# ============================================================================
# UAVAntiUAV - Jetson AGX Orin (unified memory)
# ============================================================================
# Cung pipeline dong bang voi config_colab.yaml. Khac o cho do phan cung:
# batch_size, num_workers, use_amp, epochs va cac duong dan.
# KET QUA KHONG SO TRUC TIEP duoc voi run Colab.
# ============================================================================

device:
  platform: jetson            # jetson | local | server
  gpu_jetson: true

paths:
  data_dir: ./processed
  raw_data_dir: ../UAV-Anti-UAV
  gasnet_weights: ../UAV/gasnet_project/test/gasnet.best.pth
  checkpoint_dir: ./checkpoints
  log_dir: ./logs

# ============================================================================
# DATA PIPELINE
# ============================================================================
data_pipeline:
  # Nguon duy nhat cua buoc thoi gian; pipeline_lock ep moi script theo no.
  frame_stride: 4
  num_before_frames: 16
  num_after_frames: 16
  bbox_padding: 0.2
  crop_size: 256
  num_workers: 2
  # Chi dung khi chay lai data_pipeline.py (phai ghi ro, xem config_colab.yaml).
  uav_anti_uav_dir: ../UAV-Anti-UAV
  output_dir: ./processed

# ============================================================================
# TRAIN
# ============================================================================
train:
  resume: ""
  backbone: "dinov3_convnext"

  # ---- model ----
  temporal_type: "attention"      # "mamba" | "attention"
  temporal_pool: attn             # to hop loi -> scale bat bien theo N
  temporal_pe: true
  # ---------------

  batch_size: 8
  num_instances: 2
  num_frames: 12
  num_workers: 2
  use_amp: false                  # unified memory -> AMP de gay NaN
  pin_memory: true

  stage1:
    epochs: 30
    lr: 3.5e-4
    weight_decay: 5.0e-4

  stage2:
    epochs: 20
    lr_backbone: 1.0e-5
    lr_temporal: 1.0e-4
    lr_head: 1.0e-4
    weight_decay: 5.0e-4

  loss:
    lam1: 1.0                 # triplet
    lam2: 0.0                 # temporal consistency: khong dong gop gradient
    lam3: 0.05                # center
    lr_center: 0.5
    triplet_margin: 0.3
    label_smooth: 0.1

# ============================================================================
# EVAL
# ============================================================================
eval:
  model_path: UAVAntiUAV/checkpoints/best_model_v2.pth
  pairs_json: ./processed/pairs_test.json
  output_dir: ./eval_results/gasnet_mamba_v2
  batch_size: 4
  num_workers: 2
  backbone: "dinov3_convnext"
  backbone_only: false
  reid_threshold: 0.7

# ============================================================================
# INFER
# ============================================================================
infer:
  backbone: dinov3_convnext
  temporal_type: attention        # ep = train.temporal_type luc chay
  seq_dir: all
  model_path: ./best_model_conv.pth
  output_video: output_reid.mp4
  out_dir: ./infer_output/infer_3.8

  stride: 4                       # ep = data_pipeline.frame_stride luc chay
  num_frames: 12                  # ep = train.num_frames luc chay
  bbox_padding: 0.2

  # t2_search_gap_tolerance: so frame target vang lien tiep toi da truoc khi reset
  # cua so soft-lock. Cua so can num_frames frame lien tuc; reset ngay khi vang 1
  # frame thi hau het event khong bao gio du frame (md/22thg9.md §4, §8.3).
  t2_search_gap_tolerance: 2

  max_anchor_size: 5
  max_recent_size: 15
  soft_lock_threshold: 0.3
  reid_threshold: 0.75
  hijack_threshold: 0.40
  hijack_check_count: 5
  update_interval_sec: 2.0

  # debug_sim: in cosine truoc bnneck (raw) va sau bnneck (fused).
  debug_sim: true

  # fine_space: khong gian dung cho gate HARD LOCK.
  #   fused  = qua ReIDHead (BatchNorm1d)
  #   pre_bn = cat(visual, temporal), dau vao bnneck
  # Doi sang pre_bn thi phai doi reid_threshold = thresholds.pre_bn trong
  # calibrated_threshold.json. Do 15/9: pre_bn kem hon fused 2.67% TAR@FAR=0.1%
  # nen giu fused (md/15thg9.md §4.1).
  fine_space: fused

# ============================================================================
# INFER ROBUSTNESS - evaluate_reid_robustness.py
# ============================================================================
infer_robustness:
  seq_dir: ./data/UAV-Anti-UAV/Test/UAV-Anti-UAV_Test_000212
  data_root: ./data/UAV-Anti-UAV/Test
  model_path: ./best_model.pth
  output_video: ./output_robustness.mp4
  out_dir: ./infer_robustness_new/UAV-Anti-UAV_Test_000212_2
  backbone: "dinov3_convnext"
  temporal_type: "attention"      # ep = train.temporal_type luc chay

  stride: 4                       # ep = data_pipeline.frame_stride luc chay
  t2_search_gap_tolerance: 2      # xem giai thich o block infer
  num_frames: 12                  # ep = train.num_frames luc chay
  bbox_padding: 0.2
  num_imposters: 5
  max_anchor_size: 5
  max_recent_size: 15
  soft_lock_threshold: 0.50
  reid_threshold: 0.75
  hijack_threshold: 0.40
  hijack_check_count: 5
  update_interval_sec: 2.0

# ============================================================================
# INFER REALWORLD - phan_rang/infer_realworld.py
# ============================================================================
infer_realworld:
  video: ./phan_rang/phanrang_raptor.mp4
  yolo_model: yolov8n.pt
  detector_conf: 0.1
  detector_imgsz: 1088
  detector_classes: [4]
  lost_threshold: 10
  model_path: ./best_model.pth
  output_video: output_phanrang.mp4
  out_dir: ./infer_realworld/phanrang_raptor_2
  query_img: ""
  start_sec: 13.0

  stride: 4                       # ep = data_pipeline.frame_stride luc chay
  t2_search_gap_tolerance: 2      # xem giai thich o block infer
  num_frames: 12                  # ep = train.num_frames luc chay
  bbox_padding: 0.2
  max_anchor_size: 5
  max_recent_size: 15
  soft_lock_threshold: 0.50
  reid_threshold: 0.75
  hijack_threshold: 0.40
  hijack_check_count: 5
  update_interval_sec: 2.0
