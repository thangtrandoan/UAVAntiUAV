# ============================================================================
# UAVAntiUAV - Local GPU (smoke test: 1 epoch moi stage)
# ============================================================================
# Cung pipeline dong bang voi config_colab.yaml, chi khac so epoch va
# batch_size. Dung de kiem code chay duoc, khong dung de lay so lieu.
# ============================================================================

device:
  platform: local             # jetson | local | server
  gpu_jetson: false

paths:
  data_dir: ./processed
  raw_data_dir: ../UAV-Anti-UAV
  gasnet_weights: ../UAV/gasnet_project/test/gasnet.best.pth
  checkpoint_dir: ./checkpoints
  log_dir: ./logs

# ============================================================================
# DATA PIPELINE
# ============================================================================
data_pipeline:
  uav_anti_uav_dir: ./data/UAV-Anti-UAV
  anti_uav_rgbt_dir: ./data/Anti-UAV-RGBT
  uav123_dir: ./data/UAV123
  output_dir: ./processed
  num_before_frames: 16
  num_after_frames: 16
  frame_stride: 4             # nguon duy nhat cua buoc thoi gian
  bbox_padding: 0.2
  crop_size: 256
  num_workers: 4

# ============================================================================
# TRAIN
# ============================================================================
train:
  backbone: dinov3_convnext
  resume: ""
  batch_size: 16
  num_instances: 4

  # ---- model (phai khop checkpoint dang nap) ----
  temporal_type: "attention"      # "mamba" | "attention"
  temporal_pool: attn
  temporal_pe: true
  # ---------------------------------------------

  num_frames: 12
  num_workers: 4
  use_amp: true
  pin_memory: true
  val_freq: 1                     # chay val moi epoch cho de debug

  stage1:
    epochs: 1
    lr: 3.5e-4
    weight_decay: 5.0e-4

  stage2:
    epochs: 1
    lr_backbone: 1.0e-5
    lr_temporal: 1.0e-4
    lr_head: 1.0e-4
    weight_decay: 5.0e-4

  loss:
    lam1: 1.0
    lam2: 0.0                 # temporal consistency: khong dong gop gradient
    lam3: 0.05
    lr_center: 0.5
    triplet_margin: 0.3
    label_smooth: 0.1

# ============================================================================
# EVAL
# ============================================================================
eval:
  backbone: dinov3_convnext
  model_path: checkpoints/best_model.pth
  query_json: ./processed/query_test.json
  gallery_json: ./processed/gallery_test.json
  output_dir: ./eval_results
  batch_size: 16
  num_workers: 4
  backbone_only: false
  reid_threshold: 0.7

# ============================================================================
# INFER
# ============================================================================
infer:
  backbone: dinov3_convnext
  seq_dir: all
  model_path: ./best_model_dino_convnext.pth
  output_video: output_reid.mp4
  out_dir: ./infer_output/infer_pipeline_3

  stride: 4                       # ep = data_pipeline.frame_stride luc chay
  num_frames: 12                  # ep = train.num_frames luc chay
  bbox_padding: 0.2

  # t2_search_gap_tolerance: so frame target vang lien tiep toi da truoc khi reset
  # cua so soft-lock. Cua so can num_frames frame lien tuc; 0 = reset ngay.
  t2_search_gap_tolerance: 2

  max_anchor_size: 5
  max_recent_size: 15
  soft_lock_threshold: 0.3
  reid_threshold: 0.75
  hijack_threshold: 0.40
  hijack_check_count: 5
  update_interval_sec: 2.0

  # debug_sim: in cosine truoc bnneck (raw) va sau bnneck (fused).
  debug_sim: true

  # fine_space: khong gian cho gate HARD LOCK, 'fused' hoac 'pre_bn'.
  # Doi sang pre_bn thi phai doi reid_threshold = thresholds.pre_bn.
  # Do 15/9: pre_bn kem hon fused 2.67% TAR nen giu fused (md/15thg9.md §4.1).
  fine_space: fused
