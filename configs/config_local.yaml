# ============================================================
# UAVAntiUAV — Local GPU Config (Smoke Test)
# Mục đích: Chạy nhanh 1 epoch để kiểm tra code không lỗi
# ============================================================

device:
  platform: local             # jetson | local | server
  gpu_jetson: false

# --- Paths ---
paths:
  data_dir: ./processed
  raw_data_dir: ../UAV-Anti-UAV
  gasnet_weights: ../UAV/gasnet_project/test/gasnet.best.pth
  checkpoint_dir: ./checkpoints
  log_dir: ./logs

# --- Data Pipeline ---
data_pipeline:
  num_before_frames: 16
  num_after_frames: 16
  bbox_padding: 0.2
  crop_size: 256
  num_workers: 4

# --- Training (smoke test: 1 epoch mỗi stage) ---
train:
  resume: ""
  batch_size: 16
  num_instances: 4
  num_frames: 16
  num_workers: 4
  use_amp: true
  pin_memory: true
  val_freq: 1                 # Local test/smoke test thì chạy val mỗi epoch để dễ debug

  stage1:
    epochs: 1                 # chỉ 1 epoch để test
    lr: 3.5e-4
    weight_decay: 5e-4

  stage2:
    epochs: 1                 # chỉ 1 epoch để test
    lr_backbone: 1.0e-5
    lr_temporal: 1.0e-4
    lr_head: 1.0e-4
    weight_decay: 5e-4

  loss:
    lam1: 1.0
    lam2: 0.5
    lam3: 0.05
    lr_center: 0.5
    triplet_margin: 0.3
    label_smooth: 0.1

# --- Evaluation ---
eval:
  model_path: checkpoints/best_model.pth
  pairs_json: ./processed/pairs_test.json
  output_dir: ./eval_results
  batch_size: 16
  num_workers: 4
  backbone_only: false
  reid_threshold: 0.7
