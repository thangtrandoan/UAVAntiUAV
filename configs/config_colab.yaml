# ============================================================
# UAVAntiUAV — Google Colab Config (A100 GPU)
# Mục đích: Huấn luyện với tốc độ và hiệu suất tối đa trên A100 (40GB/80GB VRAM)
# ============================================================

device:
  platform: colab
  gpu_jetson: false

# --- Paths (Lưu ý: Thay đổi đường dẫn Google Drive cho phù hợp) ---
paths:
  # Nơi chứa thư mục UAV-Anti-UAV gốc trên Google Drive
  raw_data_dir: /content/UAV-Anti-UAV
  # Trọng số pre-train của mạng GASNet trên Google Drive (sau khi train VRU)
  gasnet_weights: /content/drive/MyDrive/output/gasnet_convnext_v0.best.pth
  
  # Đường dẫn thư mục chứa mã nguồn GASNet (4 file python bạn vừa copy vào)
  gasnet_dir: /content/UAVAntiUAV/gasnet
  
  # Lưu kết quả data_pipeline ngay trên Colab (để đọc nhanh)
  data_dir: /content/processed
  
  # QUAN TRỌNG: Lưu checkpoint trực tiếp lên Google Drive để tránh mất khi Colab ngắt
  checkpoint_dir: /content/drive/MyDrive/UAV_Anti_UAV/checkpoints/v3.9
  log_dir: /content/drive/MyDrive/UAV_Anti_UAV/logs/v3.9

# --- Data Pipeline ---
data_pipeline:
  # 🛠️ (15/9) NGUỒN DUY NHẤT của frame_stride — train và infer đều đọc từ đây.
  # Bước thời gian giữa 2 frame liên tiếp trong cửa sổ temporal PHẢI giống nhau
  # ở data → train → infer (xem md/15thg9.md §13).
  frame_stride: 4
  num_before_frames: 16
  num_after_frames: 16
  bbox_padding: 0.2
  crop_size: 256
  num_workers: 8            

# --- Training (Tối ưu cho A100) ---
train:
  resume: ""
  backbone: "dinov3_convnext"  # Sử dụng kiến trúc mới DINOv3
  batch_size: 9              # Giảm 12->9 (md/22thg9.md §22.3): RAM ∝ B*N. VRAM thật =
                             # 2*B*N ảnh (before+after) = 2*9*16 = 288 @N=16 (trước: 384)
  num_instances: 3           
  num_frames: 12
  # 🛠️ (22/9) N RANDOM THEO BATCH (md/22thg9.md §16). Mỗi batch dùng MỘT N
  # trong danh sách này — CÙNG N cho query (after) và gallery (before), vì loss
  # so sánh chúng. Bỏ key này / để 1 phần tử = hành vi cũ (N cố định).
  # Lưu ý: không làm epoch dài thêm (sampler rút 1 N cho mỗi batch).
  # 🛠️ (22/9) THU 7 -> 3 giá trị (md/22thg9.md §25.3). `n_frames_choices` chia đều ngân
  # sách batch, nên L=3 cho 2.33x tín hiệu MỖI N ở CÙNG chi phí.
  # [8,12,16] khớp ĐÚNG dải deploy và khớp `val_n_list` (tiêu chí kiểm chứng).
  # Đã bỏ N=4: conv1d(kernel_size=4, padding=3) với L=4 -> vùng đệm (3) gần bằng cả
  # chuỗi (4) -> hiệu ứng biên lấn át, tín hiệu temporal vô nghĩa.
  n_frames_choices: [8, 12, 16]
  num_workers: 8              # Tăng worker để cấp đủ data cho GPU
  use_amp: true               # BẮT BUỘC BẬT: A100 tận dụng Tensor Cores train cực nhanh với AMP
  pin_memory: true
  use_compile: true
  # 🛠️ (22/9) N RANDOM -> mỗi N là một SHAPE khác -> dynamic=True để torch.compile
  # KHÔNG biên dịch lại cho từng N (xem md/22thg9.md §27.3).
  compile_dynamic: true          # Tắt compile mặc định cho an toàn (tránh lỗi với custom CUDA kernels/Mamba)
  val_freq: 5
  # 🛠️ (22/9) ĐO NHIỀU N + EARLY STOPPING (md/22thg9.md §25, §27).
  # Tiêu chí đạt là "fused >= target_rank1 ở CẢ các N và lệch <= target_spread".
  # ĐIỂM dùng cho early stop = MIN qua các N (tối ưu ca xấu nhất), KHÔNG phải trung bình.
  val_n_list: [8, 12, 16]
  target_rank1: 0.85          # mọi N phải >= mức này
  target_spread: 0.05         # độ lệch max-min giữa các N
  stop_on_target: true        # đạt tiêu chí -> dừng ngay
  early_stop_patience: 4      # số LẦN VALIDATION liên tiếp không cải thiện (0 = tắt)
  early_stop_min_delta: 1.0e-4                # Số epoch giữa các lần chạy validation (để là 1 nếu muốn test mỗi epoch)

  stage1:
    epochs: 60
    lr: 3.5e-4
    weight_decay: 5e-4

  stage2:
    epochs: 30
    lr_backbone: 1.0e-5
    lr_temporal: 1.0e-4
    lr_head: 1.0e-4
    weight_decay: 5e-4

  loss:
    lam1: 1.0
    lam2: 0.5
    # lam3 nhỏ (0.001) vì center loss tính trên feature THÔ (1472-d) — lam3=0.05 sẽ dominate gradient
    lam3: 0.001
    lr_center: 0.5
    triplet_margin: 0.3
    label_smooth: 0.1

# --- Evaluation ---
eval:
  model_path: /content/best_model.pth
  query_json: /content/processed/query_test.json
  gallery_json: /content/processed/gallery_test.json
  output_dir: /content/drive/MyDrive/UAV_Anti_UAV/eval_results/v3.9
  batch_size: 32             # Khi test không cần tính gradient nên để batch size rất lớn
  num_workers: 8
  backbone: "dinov3_convnext"
  backbone_only: false
  reid_threshold: 0.7
  intra_sequence: false
  # 🛠️ (14/9): không gian feature dùng làm CHÍNH khi evaluate (áp calibrated threshold + visualization).
  #   fused  = qua ReIDHead (BatchNorm1d)  — hành vi cũ (fine score của infer.py)
  #   pre_bn = cat(visual, temporal)       — ĐẦU VÀO bnneck (raw)
  # Cả hai KHÔNG gian luôn được đánh giá song song trong cùng 1 lượt chạy để so sánh.
  space: fused
  max_correct_vis: 0         # Tắt lưu ảnh để chạy nhanh và tiết kiệm dung lượng
  # Dùng threshold đã calibrate từ calibrate_threshold.py (Fixed FAR strategy)
  # Chạy calibrate_threshold.py trước để tạo file này
  threshold_file: /content/drive/MyDrive/UAV_Anti_UAV/calib_results/calibrated_threshold.json

# --- Threshold Calibration ---
calibration:
  output_dir: /content/drive/MyDrive/UAV_Anti_UAV/calib_results/v3.8
  cal_ratio: 0.4             # 40% sequences dùng để tìm threshold, 60% còn lại là holdout eval
  far_target: 0.001          # FAR mục tiêu = 0.1%
  seed: 42                   # Seed cố định để split reproducible

# --- Inference ---
infer:
  backbone: dinov3_convnext
  seq_dir: all
  model_path: /content/best_model.pth
  output_video: output_reid.mp4
  out_dir: ./infer_output/infer_pipeline_3.5
  # 🛠️ (15/9) PHẢI = data_pipeline.frame_stride. `infer.py` tự đọc và GHI ĐÈ từ
  # `data_pipeline.frame_stride`, nên giá trị ở đây chỉ là tài liệu tham chiếu.
  stride: 4
  # 🛠️ (22/9) NỚI RESET trong T2_SEARCH: chịu được bấy nhiêu frame target VẮNG
  # LIÊN TIẾP trước khi reset cửa sổ soft-lock về 0 (md/22thg9.md §4, §8.3).
  # Cửa sổ cần (num_frames-1)*stride+1 frame liên tục; 1 frame vắng mà reset ngay
  # thì hầu hết event không bao giờ đủ frame. 0 = hành vi cũ (reset ngay).
  t2_search_gap_tolerance: 2
  num_frames: 12
  bbox_padding: 0.2
  max_anchor_size: 5
  max_recent_size: 15
  soft_lock_threshold: 0.3
  reid_threshold: 0.75
  hijack_threshold: 0.40
  hijack_check_count: 5
  update_interval_sec: 2.0
  # 🛠️ (14/9): in cosine TRƯỚC bnneck (raw) vs SAU bnneck (fused).
  debug_sim: true
  # 🛠️ (14/9): không gian dùng cho gate HARD LOCK.
  #   fused  = qua ReIDHead (BatchNorm1d) — hành vi cũ
  #   pre_bn = cat(visual, temporal)      — đầu vào bnneck (raw cosine)
  # ⚠️ Đổi sang pre_bn thì PHẢI đổi `reid_threshold` = thresholds.pre_bn trong
  #    calibrated_threshold.json (chạy calibrate_threshold.py trước). Hai thang điểm khác nhau.
  # ✅ Đã kiểm chứng 15/9: pre_bn KÉM hơn fused 2.67% TAR@FAR=0.1% -> GIỮ fused (xem md/15thg9.md §4.1).
  fine_space: fused
  time_source: video

# --- Inference Robustness Test ---
infer_robustness:
  seq_dir: /content/UAV-Anti-UAV/Test/UAV-Anti-UAV_Test_000059
  data_root: /content/UAV-Anti-UAV/Test
  model_path: /content/best_model.pth
  output_video: output_robustness.mp4
  backbone: "dinov3_convnext"
  reid_threshold: 0.7
  # 🛠️ (15/9) PHẢI = data_pipeline.frame_stride (= 4) — đồng bộ bước thời gian temporal.
  stride: 4
  # 🛠️ (22/9) NỚI RESET trong T2_SEARCH: chịu được bấy nhiêu frame target VẮNG
  # LIÊN TIẾP trước khi reset cửa sổ soft-lock về 0 (md/22thg9.md §4, §8.3).
  # Cửa sổ cần (num_frames-1)*stride+1 frame liên tục; 1 frame vắng mà reset ngay
  # thì hầu hết event không bao giờ đủ frame. 0 = hành vi cũ (reset ngay).
  t2_search_gap_tolerance: 2
  # 🛠️ FIX (14/9): khớp `train.num_frames: 12` (trước đây = 16).
  # `evaluate_reid_robustness.py` đọc block này qua cfg.get('infer_robustness').
  num_frames: 12
  bbox_padding: 0.2
  num_imposters: 10
  time_source: video