# ============================================================
# UAVAntiUAV — Google Colab Config (A100 GPU)
# Mục đích: Huấn luyện với tốc độ và hiệu suất tối đa trên A100 (40GB/80GB VRAM)
# ============================================================

device:
  platform: colab
  gpu_jetson: false

# --- Paths (Lưu ý: Thay đổi đường dẫn Google Drive cho phù hợp) ---
paths:
  # Nơi chứa thư mục UAV-Anti-UAV gốc trên Google Drive
  raw_data_dir: /content/UAV-Anti-UAV
  # Trọng số pre-train của mạng GASNet trên Google Drive
  gasnet_weights: /content/gasnet.best.pth
  
  # Đường dẫn thư mục chứa mã nguồn GASNet (4 file python bạn vừa copy vào)
  gasnet_dir: /content/UAVAntiUAV/gasnet
  
  # Lưu kết quả data_pipeline ngay trên Colab (để đọc nhanh)
  data_dir: /content/processed
  
  # QUAN TRỌNG: Lưu checkpoint trực tiếp lên Google Drive để tránh mất khi Colab ngắt
  checkpoint_dir: /content/drive/MyDrive/UAV_Anti_UAV/checkpoints
  log_dir: /content/drive/MyDrive/UAV_Anti_UAV/logs

# --- Data Pipeline ---
data_pipeline:
  num_before_frames: 16
  num_after_frames: 16
  bbox_padding: 0.2
  crop_size: 256
  num_workers: 8              # CPU trên Colab khá mạnh, tăng lên 8 để load data nhanh

# --- Training (Tối ưu cho A100) ---
train:
  resume: ""
  batch_size: 12              # A100 có VRAM khổng lồ, thoải mái set 64 hoặc thậm chí 128
  num_instances: 3            # 4 ảnh cho mỗi đối tượng -> Rất tốt cho Triplet Loss
  num_frames: 12
  num_workers: 8              # Tăng worker để cấp đủ data cho GPU
  use_amp: true               # BẮT BUỘC BẬT: A100 tận dụng Tensor Cores train cực nhanh với AMP
  pin_memory: true
  use_compile: true          # Tắt compile mặc định cho an toàn (tránh lỗi với custom CUDA kernels/Mamba)
  val_freq: 5                # Số epoch giữa các lần chạy validation (để là 1 nếu muốn test mỗi epoch)

  stage1:
    epochs: 30
    lr: 3.5e-4
    weight_decay: 5e-4

  stage2:
    epochs: 30
    lr_backbone: 1.0e-5
    lr_temporal: 1.0e-4
    lr_head: 1.0e-4
    weight_decay: 5e-4

  loss:
    lam1: 1.0
    lam2: 0.5
    lam3: 0.05
    lr_center: 0.5
    triplet_margin: 0.3
    label_smooth: 0.1

# --- Evaluation ---
eval:
  model_path: /content/best_model.pth
  pairs_json: /content/processed/pairs_test.json
  output_dir: /content/drive/MyDrive/UAV_Anti_UAV/eval_results
  batch_size: 128             # Khi test không cần tính gradient nên để batch size rất lớn
  num_workers: 8
  backbone_only: false
  reid_threshold: 0.7
