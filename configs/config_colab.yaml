# ============================================================
# UAVAntiUAV — Google Colab Config (A100 GPU)
# Mục đích: Huấn luyện với tốc độ và hiệu suất tối đa trên A100 (40GB/80GB VRAM)
# ============================================================

device:
  platform: colab
  gpu_jetson: false

# --- Paths (Lưu ý: Thay đổi đường dẫn Google Drive cho phù hợp) ---
paths:
  # Nơi chứa thư mục UAV-Anti-UAV gốc trên Google Drive
  raw_data_dir: /content/UAV-Anti-UAV
  # Trọng số pre-train của mạng GASNet trên Google Drive (sau khi train VRU)
  gasnet_weights: /content/drive/MyDrive/output/gasnet_convnext_v0.best.pth
  
  # Đường dẫn thư mục chứa mã nguồn GASNet (4 file python bạn vừa copy vào)
  gasnet_dir: /content/UAVAntiUAV/gasnet
  
  # Lưu kết quả data_pipeline ngay trên Colab (để đọc nhanh)
  data_dir: /content/processed
  
  # QUAN TRỌNG: Lưu checkpoint trực tiếp lên Google Drive để tránh mất khi Colab ngắt
  checkpoint_dir: /content/drive/MyDrive/UAV_Anti_UAV/checkpoints/v3.9
  log_dir: /content/drive/MyDrive/UAV_Anti_UAV/logs/v3.9

# --- Data Pipeline ---
data_pipeline:
  # 🛠️ (15/9) NGUỒN DUY NHẤT của frame_stride — train và infer đều đọc từ đây.
  # Bước thời gian giữa 2 frame liên tiếp trong cửa sổ temporal PHẢI giống nhau
  # ở data → train → infer (xem md/15thg9.md §13).
  frame_stride: 4
  num_before_frames: 16
  num_after_frames: 16
  bbox_padding: 0.2
  crop_size: 256
  num_workers: 8            

# --- Training (Tối ưu cho A100) ---
train:
  resume: "/content/drive/MyDrive/UAV_Anti_UAV/checkpoints/v3.9/best_model.pth" 
  # 🛠️ (24/9) Chỉ dùng khi resume từ checkpoint CŨ (chưa lưu `best_val_rank1`).
  # = -1: dùng giá trị trong checkpoint. >=0: ép giá trị này (vd 0.6156 cho best epoch 35).
  resume_best_rank1: 0.6156
  backbone: "dinov3_convnext"  
  batch_size: 9           
  num_instances: 3           
  temporal_pool: attn
  temporal_pe: true
  num_frames: 12
  n_frames_choices: [8, 12, 16]
  num_workers: 8              # Tăng worker để cấp đủ data cho GPU
  use_amp: true               # BẮT BUỘC BẬT: A100 tận dụng Tensor Cores train cực nhanh với AMP
  pin_memory: true
  use_compile: true
  compile_dynamic: false
  val_freq: 5
  val_n_list: [8, 12, 16]
  target_rank1: 0.85          # mọi N phải >= mức này
  target_spread: 0.05         # độ lệch max-min giữa các N
  stop_on_target: true        # đạt tiêu chí -> dừng ngay
  early_stop_patience: 4      # số LẦN VALIDATION liên tiếp không cải thiện (0 = tắt)
  early_stop_min_delta: 1.0e-4                # Số epoch giữa các lần chạy validation (để là 1 nếu muốn test mỗi epoch)

  stage1:
    epochs: 60
    lr: 3.5e-4
    weight_decay: 5e-4

  stage2:
    epochs: 30
    lr_backbone: 1.0e-5
    lr_temporal: 1.0e-4
    lr_head: 1.0e-4
    weight_decay: 5e-4

  loss:
    lam1: 1.0
    lam2: 0.0
    # lam3 nhỏ (0.001) vì center loss tính trên feature THÔ (1472-d) — lam3=0.05 sẽ dominate gradient
    lam3: 0.001
    lr_center: 0.5
    triplet_margin: 0.3
    label_smooth: 0.1

# --- Evaluation ---
eval:
  model_path: /content/best_model.pth
  query_json: /content/processed/query_test.json
  gallery_json: /content/processed/gallery_test.json
  output_dir: /content/drive/MyDrive/UAV_Anti_UAV/eval_results/v3.9
  batch_size: 32             # Khi test không cần tính gradient nên để batch size rất lớn
  num_workers: 8
  backbone: "dinov3_convnext"
  backbone_only: false
  reid_threshold: 0.7
  intra_sequence: false
  space: fused
  max_correct_vis: 0         # Tắt lưu ảnh để chạy nhanh và tiết kiệm dung lượng
  # Dùng threshold đã calibrate từ calibrate_threshold.py (Fixed FAR strategy)
  # Chạy calibrate_threshold.py trước để tạo file này
  threshold_file: /content/drive/MyDrive/UAV_Anti_UAV/calib_results/calibrated_threshold.json

# --- Threshold Calibration ---
calibration:
  output_dir: /content/drive/MyDrive/UAV_Anti_UAV/calib_results/v3.8
  cal_ratio: 0.4             # 40% sequences dùng để tìm threshold, 60% còn lại là holdout eval
  far_target: 0.001          # FAR mục tiêu = 0.1%
  seed: 42                   # Seed cố định để split reproducible

# --- Inference ---
infer:
  backbone: dinov3_convnext
  seq_dir: all
  model_path: /content/best_model.pth
  output_video: output_reid.mp4
  out_dir: ./infer_output/infer_pipeline_3.5
  stride: 4
  t2_search_gap_tolerance: 2
  num_frames: 12
  bbox_padding: 0.2
  max_anchor_size: 5
  max_recent_size: 15
  soft_lock_threshold: 0.3
  reid_threshold: 0.75
  hijack_threshold: 0.40
  hijack_check_count: 5
  update_interval_sec: 2.0
  debug_sim: true
  fine_space: fused
  time_source: video

# --- Inference Robustness Test ---
infer_robustness:
  seq_dir: /content/UAV-Anti-UAV/Test/UAV-Anti-UAV_Test_000059
  data_root: /content/UAV-Anti-UAV/Test
  model_path: /content/best_model.pth
  output_video: output_robustness.mp4
  backbone: "dinov3_convnext"
  reid_threshold: 0.7
  stride: 4
  t2_search_gap_tolerance: 2
  num_frames: 12
  bbox_padding: 0.2
  num_imposters: 10
  time_source: video